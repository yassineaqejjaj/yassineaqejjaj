<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Agentic development lifecycle</title><desc id="desc">Eight stages from intent to measurement, with human gates and a feedback loop back to intent</desc>
<rect width="1280" height="560" rx="24" fill="#101929"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8FA1BC"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9A9FF"/></marker></defs>
<text x="48" y="58" fill="#63D6AE" font-family="Arial,sans-serif" font-weight="700" font-size="18" letter-spacing="3">AGENTIC DEVELOPMENT LIFECYCLE</text>
<text x="48" y="100" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="30">Agents accelerate the work. People own the decisions.</text>
<rect x="48" y="150" width="270" height="124" rx="16" fill="#1A2638" stroke="#9B8AFB" stroke-width="2"/><circle cx="84" cy="188" r="16" fill="#9B8AFB"/><text x="84" y="194" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="17">1</text><text x="112" y="195" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="22">Intent</text><text x="70" y="234" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">Problem, users and</text><text x="70" y="256" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">acceptance criteria</text>
<rect x="352" y="150" width="270" height="124" rx="16" fill="#1A2638" stroke="#6FB1FC" stroke-width="2"/><circle cx="388" cy="188" r="16" fill="#6FB1FC"/><text x="388" y="194" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="17">2</text><text x="416" y="195" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="22">Architecture</text><text x="374" y="234" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">Spec, boundaries,</text><text x="374" y="256" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">risks, decisions</text>
<rect x="656" y="150" width="270" height="124" rx="16" fill="#1A2638" stroke="#63D6AE" stroke-width="2"/><circle cx="692" cy="188" r="16" fill="#63D6AE"/><text x="692" y="194" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="17">3</text><text x="720" y="195" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="22">Agent build</text><text x="678" y="234" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">AI-assisted implementation</text><text x="678" y="256" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">in small steps</text>
<rect x="960" y="150" width="270" height="124" rx="16" fill="#1A2638" stroke="#F5B84B" stroke-width="2"/><circle cx="996" cy="188" r="16" fill="#F5B84B"/><text x="996" y="194" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="17">4</text><text x="1024" y="195" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="22">Human review</text><text x="982" y="234" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">Diff review, security,</text><text x="982" y="256" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">accept or reject</text>
<rect x="960" y="380" width="270" height="124" rx="16" fill="#1A2638" stroke="#F27D8E" stroke-width="2"/><circle cx="996" cy="418" r="16" fill="#F27D8E"/><text x="996" y="424" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="17">5</text><text x="1024" y="425" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="22">Verify</text><text x="982" y="464" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">Tests, evals, traces,</text><text x="982" y="486" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">regression checks</text>
<rect x="656" y="380" width="270" height="124" rx="16" fill="#1A2638" stroke="#B7E36B" stroke-width="2"/><circle cx="692" cy="418" r="16" fill="#B7E36B"/><text x="692" y="424" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="17">6</text><text x="720" y="425" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="22">Release gate</text><text x="678" y="464" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">Explicit criteria,</text><text x="678" y="486" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">approval, rollback plan</text>
<rect x="352" y="380" width="270" height="124" rx="16" fill="#1A2638" stroke="#4FD1C5" stroke-width="2"/><circle cx="388" cy="418" r="16" fill="#4FD1C5"/><text x="388" y="424" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="17">7</text><text x="416" y="425" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="22">Deploy</text><text x="374" y="464" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">CI/CD, preview,</text><text x="374" y="486" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">versioned release record</text>
<rect x="48" y="380" width="270" height="124" rx="16" fill="#1A2638" stroke="#C79BFF" stroke-width="2"/><circle cx="84" cy="418" r="16" fill="#C79BFF"/><text x="84" y="424" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="17">8</text><text x="112" y="425" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="700" font-size="22">Measure</text><text x="70" y="464" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">Usage, quality,</text><text x="70" y="486" fill="#C0CAD8" font-family="Arial,sans-serif" font-size="16">cost, incidents</text>
<path d="M321 212.0 L349 212.0" stroke="#8FA1BC" stroke-width="2.5" fill="none" />
<path d="M625 212.0 L653 212.0" stroke="#8FA1BC" stroke-width="2.5" fill="none" />
<path d="M929 212.0 L957 212.0" stroke="#8FA1BC" stroke-width="2.5" fill="none" />
<path d="M1095.0 277 L1095.0 375" stroke="#8FA1BC" stroke-width="2.5" fill="none" />
<path d="M957 442.0 L929 442.0" stroke="#8FA1BC" stroke-width="2.5" fill="none" />
<path d="M653 442.0 L625 442.0" stroke="#8FA1BC" stroke-width="2.5" fill="none" />
<path d="M349 442.0 L321 442.0" stroke="#8FA1BC" stroke-width="2.5" fill="none" />
<path d="M183.0 377 L183.0 279" stroke="#B9A9FF" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/>
<text x="199.0" y="332.0" fill="#B9A9FF" font-family="Arial,sans-serif" font-size="16">Feedback loop: measurements and incidents become the next intent</text>
<g transform="translate(206 137)"><rect width="104" height="26" rx="13" fill="#F5B84B"/><text x="52" y="18" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="13">HUMAN GATE</text></g>
<g transform="translate(510 137)"><rect width="104" height="26" rx="13" fill="#F5B84B"/><text x="52" y="18" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="13">HUMAN GATE</text></g>
<g transform="translate(1118 137)"><rect width="104" height="26" rx="13" fill="#F5B84B"/><text x="52" y="18" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="13">HUMAN GATE</text></g>
<g transform="translate(814 367)"><rect width="104" height="26" rx="13" fill="#F5B84B"/><text x="52" y="18" text-anchor="middle" fill="#101929" font-family="Arial,sans-serif" font-weight="700" font-size="13">HUMAN GATE</text></g>
<text x="48" y="540" fill="#8FA1BC" font-family="Arial,sans-serif" font-size="14">Human gates: intent and architecture are decided by people, every change is reviewed, every release passes explicit criteria.</text><path d="M349.0 212.0 l-9 -6 l0 12z" fill="#8FA1BC"/><path d="M653.0 212.0 l-9 -6 l0 12z" fill="#8FA1BC"/><path d="M957.0 212.0 l-9 -6 l0 12z" fill="#8FA1BC"/><path d="M1095.0 375.0 l-6 -9 l12 0z" fill="#8FA1BC"/><path d="M929.0 442.0 l9 -6 l0 12z" fill="#8FA1BC"/><path d="M625.0 442.0 l9 -6 l0 12z" fill="#8FA1BC"/><path d="M321.0 442.0 l9 -6 l0 12z" fill="#8FA1BC"/><path d="M183.0 279.0 l-6 9 l12 0z" fill="#B9A9FF"/>
</svg>
